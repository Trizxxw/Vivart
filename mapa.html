<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VivArt</title>

    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background"></div>

    <aside class="sidebar">
        <div class="logo">
            <h1>VivArt</h1>
        </div>

        <nav>
            <a href="index.html">Início</a>
            <a href="eventos.html">Eventos</a>
            <a href="mapa.html">Mapa</a>
            <a href="acervo.html">Acervo</a>
            <a href="perfil.html">Perfil</a>
        </nav>
    </aside>

    <main>

        <header>
            <div class="search-box">
                <input type="text" placeholder="Buscar eventos...">
            </div>

            <div class="header-actions">
                <button>Filtros</button>
                <button>Notificações</button>
            </div>
        </header>

        <section class="map-page">

    <div class="map-container">

        <div class="map">
            <img src="imagens/mapa.png" alt="Mapa">

            <img src="imagens/jornada.jpg" class="event-pin pin1">
            <img src="imagens/feira.png" class="event-pin pin2">
            <img src="imagens/recbeat.png" class="event-pin pin3">
            <img src="imagens/cine-apipucos.jpg" class="event-pin pin4">
        </div>

    </div>

    <aside class="events-nearby">

        <h2>Eventos Próximos</h2>

        <div class="mini-event">
            <img src="imagens/cine-apipucos.jpg" alt="Cinema ar livre">
            <div>
                <h4>Cinema ao ar livre</h4>
                <p>2 km de distância</p>
            </div>
        </div>

        <div class="mini-event">
            <img src="imagens/feira.png" alt="feira artesanato">
            <div>
                <h4>Feira de artesanato</h4>
                <p>3 km de distância</p>
            </div>
        </div>

        <div class="mini-event">
            <img src="imagens/JornadaMcs.jpg" alt="JornadaMcs">
            <div>
                <h4>Jornada de Mc's</h4>
                <p>5 km de distância</p>
            </div>
        </div>

    </aside>

</section>
    </main>
<script src="js/script.js"></script>
</body>
</html>
