<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VivArt</title>

    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background"></div>

    <aside class="sidebar">
        <div class="logo">
            <h1>VivArt</h1>
        </div>

        <nav>
            <a href="Index.html">Início</a>
            <a href="eventos.html">Eventos</a>
            <a href="mapa.html">Mapa</a>
            <a href="acervo.html"class="active">Acervo</a>
            <a href="perfil.html">Perfil</a>
        </nav>
    </aside>

    <main>

        <header>
            <div class="search-box">
                <input type="text" placeholder="Buscar eventos...">
            </div>

            <div class="header-actions">
                <button>Filtros</button>
                <button>Notificações</button>
            </div>
        </header>
        <section class="feed-page">

    <div class="create-post">

        <img src="imagens/perfil2.jpg" alt="" class="user-avatar">

        <input
            type="text"
            placeholder="Compartilhe algo sobre arte, cultura ou um evento..."
        >

        <button>Publicar</button>

    </div>

    <div class="feed">

        <article class="post">

    <div class="post-header">
        <img src="imagens/cantora.png" alt="foto perfil artista">
        <div>
            <h4>Maria Eduarda</h4>
            <span>há 2 horas</span>
        </div>
    </div>

    <img src="imagens/cantora.png" alt="publicação" class="post-image">

    <div class="post-content">
        <p>
            Apresentação do dia 15/05.
        </p>
    </div>

    <div class="post-actions">
        <span>❤︎ 120</span>
        <span> 🗨 18</span>
        <span>Salvar</span>
    </div>

</article>

    </div>

        </section>
    </main>

</body>
</html>
