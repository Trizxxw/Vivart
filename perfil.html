<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VivArt</title>

    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background"></div>

    <aside class="sidebar">
        <div class="logo">
            <h1>VivArt</h1>
        </div>

        <nav>
            <a href="index.html">Início</a>
            <a href="eventos.html">Eventos</a>
            <a href="mapa.html">Mapa</a>
            <a href="acervo.html">Acervo</a>
            <a href="perfil.html">Perfil</a>
        </nav>
    </aside>

    <main>

        <header>
        <section class="profile-page">

    <div class="profile-header">

        <img src="imagens/foto-perfil.jpg" alt="Foto do usuário" class="profile-avatar">

        <div class="profile-info">
            <h2>USUÁRIO</h2>
            <p>@usuário0000000000</p>

        </div>

    </div>

    <div class="profile-stats">

        <div class="profile-stat">
            <h3>24</h3>
            <p>Eventos Visitados</p>
        </div>

        <div class="profile-stat">
            <h3>2</h3>
            <p>Favoritos</p>
        </div>

        <div class="profile-stat">
            <h3>1</h3>
            <p>Ingressos Ativos</p>
        </div>

    </div>

    <section class="profile-section">

        <h3>Ingressos Ativos</h3>

        <div class="cards">

            <article class="card">
                <img src="imagens/Festa.png" alt="Festa">
                <div class="card-info">
                    <h4>House Party Music</h4>
                    <p>Sábado • 21:00</p>
                    <span>Confirmado</span>
                </div>
            </article>

                </div>
            </article>

        </div>

    </section>

    <section class="profile-section">

        <h3>Eventos Favoritos</h3>

        <div class="cards">

            <article class="card">
                <img src="imagens/JornadaMcs.jpg" alt="JornadaMcs">
                <div class="card-info">
                    <h4>Jornada de Mc's</h4>
                    <p>01/07 • 18:00</p>
                    <span>Favoritado</span>
                </div>
            </article>

            <article class="card">
                <img src="imagens/recbeat.png" alt="recbeat">
                <div class="card-info">
                    <h4>Rec beat</h4>
                    <p>14/06 • 19:00</p>
                    <span>Favoritado</span>
                </div>
            </article>

        </div>

    </section>

        </section>

    </main>
<script src="js/script.js"></script>
</body>
</html>
